# Jarvis dependency lockfile
#
# An exact, hash-pinned resolution of the runtime dependencies declared in
# pyproject.toml. pyproject pins only major-version ranges, so two installs a
# month apart are not the same install; this file is what makes a build
# reproducible.
#
# SCOPE
#   In:  [project].dependencies, transitively resolved.
#   Out: the [project.optional-dependencies].dev extra (pytest, pytest-asyncio,
#        ruff, pyright, pyinstaller). Those are developer tooling, not part of
#        the shipped application, and CI installs them from pyproject so the
#        toolchain can move independently of the app.
#
# USE
#   pip install --require-hashes -r requirements.lock
#
#   Every entry is pinned with == and carries sha256 hashes, so pip refuses any
#   artifact that does not match what was resolved here.
#
# REGENERATE  (in the same pull request as any pyproject dependency change)
#   pip install uv
#   uv pip compile --universal --generate-hashes --python-version 3.11 \
#       --output-file requirements.lock pyproject.toml
#
#   --universal is what makes this file usable for the Windows build. An
#   ordinary resolve is specific to the machine that ran it: it drops every
#   requirement whose environment marker is false there and records wheel
#   hashes for that one platform. Universal mode resolves for all supported
#   platforms at once and keeps the markers — which is why pyautogui, pynput and
#   pywin32 appear below carrying `; sys_platform == 'win32'`, and why both the
#   Windows and the Linux wheel hashes are present.
#
#   (A handful of entries carry markers that can never be true, such as
#   `sys_platform == 'win32' and 'linux' in sys_platform`. That is universal
#   resolution intersecting our win32 marker with the dependency's own
#   platform marker; those lines simply never install anywhere.)
#
# THE pip-tools ALTERNATIVE
#   pip install pip-tools
#   pip-compile --generate-hashes --output-file=requirements.lock pyproject.toml
#
#   pip-compile has no universal mode, so its output is only valid for the
#   platform and interpreter that produced it. Run on Linux it silently omits
#   the Windows-only packages; run on Windows it omits nothing but the result
#   cannot be installed on the Linux CI leg. If you use it, run it on Windows
#   with Python 3.11 — the platform Jarvis ships from — and treat the result as
#   Windows-only.
#
# Generated with uv 0.12.11 (--universal --generate-hashes --python-version 3.11).
# Do not hand-edit: regenerate, and never invent a hash.
